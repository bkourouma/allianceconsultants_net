# Ce nginx est derrière celui de l'hôte, qui termine le TLS : lui ne voit que du http.
# On conserve donc le schéma et l'hôte déjà indiqués par le nginx de l'hôte (X-Forwarded-*)
# et on ne retombe sur $scheme / $host que s'ils sont absents. Sans cela, Next/NextAuth
# croient être en http (cookies non sécurisés, URL de redirection en http://).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
  default $http_x_forwarded_host;
  ""      $host;
}

upstream nextjs_upstream {
  server web:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name allianceconsultants.net www.allianceconsultants.net _;

  client_max_body_size 25m;

  # Static assets emitted by Next standalone
  location /_next/static/ {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache_valid 200 60m;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Assistant IA : la réponse est diffusée au fil de l'eau (NDJSON) ; ne pas la mettre en mémoire tampon.
  location /api/assistant/chat {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 90s;
  }

  location / {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $forwarded_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }
}
